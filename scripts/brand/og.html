<!doctype html>
<!-- Source of public/og.png. Serve the repo root over http so the icon loads, open this page in Playwright headless
     at viewport 1200x630, scale 1, and screenshot it. The fonts load from Google Fonts, so render it online. Open it
     with ?lang=nl for public/og-nl.png, the Dutch pages' preview. public/icon.svg is the favicon and the source of
     favicon.ico: screenshot it at 48x48 with a transparent background and save it as ICO. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og.png source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@600&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf9f6;
    color: #17181b;
    font-family: "Source Sans 3", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    box-sizing: border-box;
    height: 100%;
    padding: 64px 80px 66px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 24px;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 52px;
    font-weight: 600;
  }
  .brand img { width: 84px; height: 84px; display: block; }
  h1 {
    margin: 0;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 70px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 38px;
    color: #54575e;
  }
  .foot strong { color: #1f4bb5; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../../public/icon.svg" alt="">Ilyas Mallah</div>
    <h1>I find out why software is slow,<br>and make it fast.</h1>
    <div class="foot"><strong>ilyasm.dev</strong><span>Open to contract work.</span></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("lang") === "nl") {
      document.documentElement.lang = "nl";
      document.querySelector("h1").style.fontSize = "68px";
      document.querySelector("h1").innerHTML = 'Ik zoek uit waarom<br>software traag is,<br>en maak het snel.';
      document.querySelector(".foot span").textContent = "Beschikbaar voor opdrachten.";
    }
  </script>
</body>
</html>
